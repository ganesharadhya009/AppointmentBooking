name: admin-spa

on:
  push:
    branches: [main]
    paths:
      - 'frontend/admin-spa/**'
      - '.github/workflows/admin-spa.yml'
  pull_request:
    paths:
      - 'frontend/admin-spa/**'
      - '.github/workflows/admin-spa.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin-spa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
